# Who gets access, which model tiers, and what they may spend.
# Usernames MUST match the IAM Identity Center userName exactly; the ABAC policy
# compares it to the "owner" tag on each engineer's inference profiles.

defaults:
  models: [sonnet]            # tiers every engineer gets unless overridden
  monthly_usd_budget: 48      # ~5.7M Opus-5 tokens uncached; 3x-4x more with caching
  monthly_token_budget: 5700000
  budget_mode: usd            # usd | tokens | either  (what "100%" means)
  enforce: true               # tag profiles exhausted at 100%; false = alerts only
  alert_thresholds: [50, 80, 100]
  min_cache_hit_rate: 0.50    # nudge engineers whose cache-read ratio falls below this
  enforce_cache: false        # true = lock profile until caching is re-enabled
  cache_window_requests: 20   # rolling window used for the cache-compliance rule

teams:
  platform:
    monthly_usd_budget: 600   # team-level AWS Budget (alerts only)
  apps:
    monthly_usd_budget: 600

engineers:
  - username: jane.doe
    email: jane.doe@agency.example.gov
    team: platform
    models: [sonnet, opus]
    monthly_usd_budget: 96    # per-engineer override
  - username: sam.lee
    email: sam.lee@agency.example.gov
    team: apps

# Model tiers. cross_region=true uses the geo inference profile (us-gov. / us.) which
# is required for models not served in-region (e.g. Fable 5.1 in GovCloud).
# Run `make preflight` to print the exact model and profile ids your account exposes,
# and adjust these if they differ.
model_tiers:
  sonnet: { model_id: anthropic.claude-sonnet-5,               cross_region: false }
  opus:   { model_id: anthropic.claude-opus-5,                 cross_region: false }
  fable:  { model_id: anthropic.claude-fable-5-1,              cross_region: true }
  haiku:  { model_id: anthropic.claude-haiku-4-5-20251001-v1:0, cross_region: false }

# USD per 1M tokens. Keys are matched as substrings of the base model id.
# These are GovCloud estimates (global list price + ~20%). Update from
# https://aws.amazon.com/bedrock/pricing/ — the budget guard reads this table.
prices:
  claude-opus-5:    { input: 6.00,  output: 30.00, cache_write: 7.50,  cache_read: 0.60 }
  claude-sonnet-5:  { input: 2.40,  output: 12.00, cache_write: 3.00,  cache_read: 0.24 }
  claude-opus-4-8:  { input: 6.00,  output: 30.00, cache_write: 7.50,  cache_read: 0.60 }
  claude-fable-5:   { input: 12.00, output: 60.00, cache_write: 15.00, cache_read: 1.20 }
  claude-haiku-4-5: { input: 1.20,  output: 6.00,  cache_write: 1.50,  cache_read: 0.12 }
  default:          { input: 6.00,  output: 30.00, cache_write: 7.50,  cache_read: 0.60 }

# Identity Center groups (must exist unless identity.manage_identity_store = true)
groups:
  engineers: bedrock-engineers
  admins: bedrock-admins
