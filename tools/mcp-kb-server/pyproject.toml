[project]
name = "mcp-kb-server"
version = "0.1.0"
description = "MCP server exposing a Bedrock Knowledge Base to Cline as a search tool"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["mcp>=1.2.0", "boto3>=1.35.0"]

[project.scripts]
mcp-kb-server = "mcp_kb_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_kb_server"]
